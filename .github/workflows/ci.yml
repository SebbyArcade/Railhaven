name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        # keeping a copy of the build is a convenience: a full storage quota must not fail the checks
        continue-on-error: true
        with:
          name: railhaven-build
          path: dist/index.html
          retention-days: 3
