<!DOCTYPE html>
<html lang="en"><head>

<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Railhaven · The Long Train</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#7fb85a;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#2c2a25;user-select:none;-webkit-user-select:none}
canvas{position:absolute;left:0;top:0;touch-action:none}
.hud{position:absolute;left:8px;right:50px;top:8px;display:flex;gap:5px;flex-wrap:wrap;z-index:2;pointer-events:none}
.chip{background:rgba(255,253,245,.96);border-radius:16px;padding:5px 9px;font-weight:700;font-size:13.5px;box-shadow:0 2px 5px rgba(0,0,0,.25)}
.chip.low{background:#ffe1dc;color:#a3271b}
.help{position:absolute;right:8px;top:8px;z-index:3;background:rgba(255,253,245,.96);border-radius:50%;width:34px;height:34px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:17px;box-shadow:0 2px 5px rgba(0,0,0,.25);cursor:pointer}
.tray{position:absolute;left:0;right:0;bottom:0;background:rgba(255,251,240,.98);border-radius:18px 18px 0 0;padding:10px 10px calc(12px + env(safe-area-inset-bottom));box-shadow:0 -3px 12px rgba(0,0,0,.3);z-index:3;max-height:62%;overflow:auto}
.tray h3{margin:0 0 3px;font-size:16px}
.tray p{margin:0 0 8px;font-size:13px;color:#5f594f;line-height:1.4}
.consist{display:flex;gap:3px;overflow-x:auto;padding:2px 0 8px}

.cards{display:flex;gap:7px}
.card{flex:1;border-radius:14px;padding:8px 4px 7px;text-align:center;background:#fff;border:3px solid #e3dccb;box-shadow:0 2px 4px rgba(0,0,0,.12);cursor:pointer}
.card.sel{border-color:#e8a317;background:#fff7e0;transform:translateY(-4px)}
.card .ic{font-size:30px;line-height:1.1}
.card b{display:block;font-size:13px;margin:3px 0}
.card span{display:inline-block;font-size:11px;border-radius:10px;padding:2px 6px;margin:1px;color:#fff;font-weight:700;line-height:1.25}
.g{background:#3f9d4b}.o{background:#e08a1e}.b{background:#3b7fc4}.p{background:#8b5cc4}.r{background:#c9483b}.gr{background:#7d776b}

.btn.off{background:#b9b2a4}

.big{font-size:44px;font-weight:900;text-align:center;color:#e08a1e;margin:4px 0}

.keep .car{cursor:pointer;width:46px;height:46px}
.keep .car.sel{border-color:#e8a317;background:#fff7e0}
</style></head><body>
<canvas id="c"></canvas>
<div class="hud" id="hud"></div>
<div class="help" id="helpBtn">?</div>
<div id="tags"></div>
<div class="tray" id="tray"></div>
<script>
'use strict';
// ───────────────────────── The Long Train ─────────────────────────
// You are one train on a journey. Pick the way at each fork, pick 1 of 3 wagons at towns.
const SAVE = 'rh-long-train-1', ROWS = 13, ROW_H = 150, MAXCARS = 8;
const WAGONS = {
  coach:  { icon: '🚃', name: 'Coach',        tags: [['g', '+8 seats']] },
  dining: { icon: '🍽', name: 'Dining car',   tags: [['g', 'fares ×1.5']] },
  tender: { icon: '🛢', name: 'Coal tender',  tags: [['b', '+6 coal space'], ['b', '+4 coal now']] },
  plough: { icon: '❄️', name: 'Snow plough',  tags: [['b', 'mountain passes safe']] },
  crane:  { icon: '🏗', name: 'Crane wagon',  tags: [['o', 'mends broken bridges'], ['o', '+6 each']] },
  goods:  { icon: '📦', name: 'Goods van',    tags: [['o', 'carries 4 goods']] },
  mail:   { icon: '✉️', name: 'Mail van',     tags: [['g', '+3 at every town']] },
  repair: { icon: '🔧', name: 'Repair car',   tags: [['b', '+1 repair each trip']] },
  band:   { icon: '🎺', name: 'Band car',     tags: [['p', '+4 passengers wait at towns']] },
  water:  { icon: '💧', name: 'Water tank',   tags: [['b', '−1 coal per trip']] },
  scope:  { icon: '🔭', name: 'Lookout car',  tags: [['p', 'see 2 more stops ahead'], ['g', '+2 per pass']] },
  royal:  { icon: '👑', name: 'Royal saloon', tags: [['p', '+30 at the port city'], ['gr', 'if repair is 6+']] },
};
const STOPS = {
  ashford:  { icon: '🏙', name: 'Ashford' },
  town:     { icon: '🏘', name: 'Town', what: 'passengers · pick a wagon' },
  fair:     { icon: '🎪', name: 'Fair town', what: 'crowds · pick 1 of 4' },
  coal:     { icon: '⛽', name: 'Coal depot', what: 'fill up with coal' },
  mine:     { icon: '⛏', name: 'Mine', what: 'load ore · uphill' },
  farm:     { icon: '🌾', name: 'Farm', what: 'load grain' },
  wood:     { icon: '🌲', name: 'Timber camp', what: 'load timber' },
  pass:     { icon: '🏔', name: 'Mountain pass', what: 'steep · snow', hill: true },
  bridge:   { icon: '🌉', name: 'Broken bridge', what: 'crane or detour' },
  shop:     { icon: '🛠', name: 'Workshop', what: 'repair · engine upgrade' },
  port:     { icon: '⚓', name: 'Port City', what: 'journey’s end' },
};
const NAMES = ['Millbrook', 'Ferndale', 'Oakhurst', 'Sandmouth', 'Kettle Cross', 'Brinemoor', 'Larkfield', 'Holloway', 'Wrenford', 'Tidewick', 'Pebbleton', 'Marrow Cove', 'Ashby Vale', 'Gorse Hill', 'Copperleigh', 'Northam', 'Willowmere', 'Stonebridge'];
const GOODS = { ore: '🪨 ore', grain: '🌾 grain', timber: '🪵 timber' };

let rs = 1; const rnd = () => (rs = (rs * 16807) % 2147483647) / 2147483647;
function hash(a, b, c) { let h = (a * 374761393 + b * 668265263 + c * 2147483647) | 0; h = (h ^ (h >>> 13)) * 1274126177; return ((h ^ (h >>> 16)) >>> 0) / 4294967296; }
const pick = a => a[Math.floor(Math.random() * a.length)];

let meta = JSON.parse(localStorage.getItem(SAVE + '-meta') || '{"best":0,"trips":0,"keep":null}');
let S = null;
function newJourney() {
  const seed = (Date.now() % 100000) + 1; rs = seed;
  const nodes = [], names = NAMES.slice().sort(() => rnd() - .5);
  nodes.push({ id: 0, row: 0, x: 206, kind: 'ashford', name: 'Ashford', next: [] });
  for (let r = 1; r < ROWS - 1; r++) {
    const n = rnd() < .55 ? 3 : 2, xs = n === 3 ? [80, 206, 332] : [125, 287];
    const kinds = [];
    for (let k = 0; k < n; k++) {
      let pool = ['town', 'town', 'coal', 'farm', 'wood', 'mine', 'pass', 'bridge'];
      if (r >= 3) pool.push('shop', 'fair'); if (r <= 1) pool = ['town', 'farm', 'wood', 'coal'];
      kinds.push(pool[Math.floor(rnd() * pool.length)]);
    }
    if (r % 2 === 0 && !kinds.some(k => k === 'town' || k === 'fair')) kinds[Math.floor(rnd() * n)] = 'town';
    if (r % 4 === 3 && !kinds.includes('coal')) kinds[Math.floor(rnd() * n)] = 'coal';
    for (let k = 0; k < n; k++) { const kind = kinds[k]; nodes.push({ id: nodes.length, row: r, x: xs[k] + (rnd() - .5) * 40, kind, name: (kind === 'town' || kind === 'fair') ? names.pop() : STOPS[kind].name, next: [], want: pick(Object.keys(GOODS)) }); }
  }
  nodes.push({ id: nodes.length, row: ROWS - 1, x: 206, kind: 'port', name: 'Port Haven', next: [] });
  // link each row to the next: nearest, plus a branch
  for (let r = 0; r < ROWS - 1; r++) {
    // edges never cross: each stop links to the nearest stop ahead, kept in left-to-right order
    const A = nodes.filter(n => n.row === r).sort((p, q) => p.x - q.x), B = nodes.filter(n => n.row === r + 1).sort((p, q) => p.x - q.x);
    const J = []; A.forEach((a, i) => { let j = 0; B.forEach((bb, k) => { if (Math.abs(bb.x - a.x) < Math.abs(B[j].x - a.x)) j = k; }); J.push(Math.max(j, i ? J[i - 1] : 0)); });
    A.forEach((a, i) => { a.next.push(B[J[i]].id); const nx = J[i] + 1; if (nx < B.length && (i === A.length - 1 || J[i + 1] >= nx) && (A.length === 1 || rnd() < .6)) a.next.push(B[nx].id); });
    B.forEach((bb, j) => { if (A.some(a => a.next.includes(bb.id))) return; let i = 0; A.forEach((a, k) => { if (J[k] <= j) i = k; }); A[i].next.push(bb.id); });
  }
  const cars = ['coach', 'coach']; if (meta.keep && WAGONS[meta.keep]) cars.push(meta.keep);
  S = { seed, nodes, at: 0, from: -1, visited: [0], cars, coal: 12, repair: 10, pax: 6, goods: [], score: 0, engine: { boiler: 0, power: 0 }, log: [], phase: 'choose', offer: null, sel: -1, legs: 0, mended: 0 };
  save();
}
const node = id => S.nodes[id];
const has = k => S.cars.filter(c => c === k).length;
const seats = () => 4 + 8 * has('coach');
const coalMax = () => 12 + 6 * has('tender');
const goodsMax = () => 4 * has('goods');
const isHill = n => n.kind === 'pass' || n.kind === 'mine';
function legCoal(to) {
  let c = 1 + Math.floor(S.cars.length / 3) - S.engine.boiler - has('water');
  if (isHill(to) && S.engine.power < 1) c += 2;
  if (to.kind === 'bridge' && !has('crane')) c += 3;
  return Math.max(1, c);
}
function legRisk(to) { if (to.kind === 'pass' && !has('plough')) return 3; return 0; }
function seeRows() { return 2 + 2 * Math.min(1, has('scope')); }

// ── travel ──
function go(id) {
  const to = node(id), from = node(S.at), cost = legCoal(to), log = [];
  let coalUsed = Math.min(S.coal, cost), short = cost - coalUsed;
  S.coal -= coalUsed;
  if (short > 0) { S.repair = Math.max(0, S.repair - short); log.push(`🔥 Out of coal: the crew burned spare timber (−${short} 🔧)`); }
  else log.push(`⛽ −${cost} coal`);
  const risk = legRisk(to); if (risk) { S.repair = Math.max(0, S.repair - risk); log.push(`🏔 Steep, snowy pass without a plough: −${risk} 🔧`); }
  if (to.kind === 'pass' && has('plough')) log.push('❄️ The plough cleared the pass');
  if (to.kind === 'pass' && has('scope')) { S.score += 2 * has('scope'); log.push(`🔭 Passengers loved the view: +${2 * has('scope')}`); }
  if (to.kind === 'bridge') { if (has('crane')) { S.score += 6; S.mended++; log.push('🏗 Your crane mended the bridge: +6'); } else log.push('🌉 Bridge down: a long detour (+3 coal)'); }
  if (has('repair')) { const before = S.repair; S.repair = Math.min(10, S.repair + has('repair')); if (S.repair > before) log.push(`🔧 Repair car: +${S.repair - before}`); }
  if (S.repair <= 0 && S.pax > 0) { const lost = Math.ceil(S.pax / 2); S.pax -= lost; log.push(`😟 The train limps: ${lost} passengers got off to walk`); }
  const fare = Math.round(S.pax * (1 + .5 * Math.min(1, has('dining'))));
  if (fare) { S.score += fare; log.push(`🧳 Fares from ${S.pax} passengers: +${fare}`); }
  S.from = S.at; S.at = id; S.visited.push(id); S.legs++;
  anim = { from: from, to, t0: performance.now(), dur: 2600 };
  S.phase = 'moving'; S.arrLog = log; S.sel = -1; save(); ui();
}
function arrive() {
  const n = node(S.at), log = S.arrLog || [];
  S.phase = 'stop'; S.offer = null;
  if (n.kind === 'town' || n.kind === 'fair') {
    const off = Math.ceil(S.pax / 2); S.pax -= off; if (off) log.push(`👋 ${off} passengers got off at ${n.name}`);
    const wait = (n.kind === 'fair' ? 12 : 6) + Math.floor(hash(S.seed, n.id, 3) * 5) + 4 * has('band');
    const on = Math.min(wait, seats() - S.pax); S.pax += on; log.push(`🧳 ${on} boarded${wait > on ? ` (${wait - on} left behind: more coaches?)` : ''}`);
    if (has('mail')) { S.score += 3 * has('mail'); log.push(`✉️ Mail delivered: +${3 * has('mail')}`); }
    const sold = S.goods.filter(g => g === n.want).length; if (sold) { S.goods = S.goods.filter(g => g !== n.want); S.score += sold * 4; log.push(`📦 ${n.name} bought ${sold} ${GOODS[n.want]}: +${sold * 4}`); }
    const top = Math.min(coalMax(), S.coal + 3); if (top > S.coal) { log.push(`⛽ The town spared ${top - S.coal} coal`); S.coal = top; }
    S.offer = { type: 'wagon', opts: wagonOffer(n.kind === 'fair' ? 4 : 3) };
  }
  if (n.kind === 'coal') { const add = coalMax() - S.coal; S.coal = coalMax(); log.push(`⛽ Filled up: +${add} coal`); }
  if (n.kind === 'mine' || n.kind === 'farm' || n.kind === 'wood') {
    const g = n.kind === 'mine' ? 'ore' : n.kind === 'farm' ? 'grain' : 'timber', room = goodsMax() - S.goods.length;
    if (room > 0) { const k = Math.min(room, 4); for (let i = 0; i < k; i++) S.goods.push(g); log.push(`📦 Loaded ${k} ${GOODS[g]}`); }
    else log.push(`📦 ${GOODS[g]} waiting, but you have no room. A goods van carries 4.`);
  }
  if (n.kind === 'shop') { S.repair = 10; log.push('🛠 Fully repaired'); S.offer = { type: 'engine', opts: ['boiler', 'power', 'length'].sort(() => Math.random() - .5) }; }
  if (n.kind === 'port') return finish(log);
  S.log = log; save(); ui();
}
function wagonOffer(n) { const ks = Object.keys(WAGONS), out = []; while (out.length < n) { const k = pick(ks); if (!out.includes(k)) out.push(k); } return out; }
const ENGINE = {
  boiler: { icon: '🔥', name: 'Bigger boiler', tags: [['b', '−1 coal per trip']] },
  power:  { icon: '💪', name: 'Stronger engine', tags: [['b', 'hills cost no extra coal']] },
  length: { icon: '➕', name: 'Longer sidings', tags: [['g', 'room for 2 more wagons']] },
};
function take(k) {
  if (S.offer.type === 'wagon') {
    if (S.cars.length >= maxCars()) return; // ui asks to uncouple first
    S.cars.push(k); if (k === 'tender') S.coal = Math.min(coalMax(), S.coal + 4);
    S.log.push(`🔗 Coupled the ${WAGONS[k].name}`);
  } else { if (k === 'length') S.engine.length = (S.engine.length || 0) + 1; else S.engine[k]++; S.log.push(`🛠 ${ENGINE[k].name} fitted`); }
  S.offer = null; S.phase = 'choose'; save(); ui();
}
const maxCars = () => MAXCARS + 2 * (S.engine.length || 0);
function uncouple(n) { const k = S.cars[n]; S.cars.splice(n, 1); if (S.pax > seats()) S.pax = seats(); while (S.goods.length > goodsMax()) S.goods.pop(); S.coal = Math.min(S.coal, coalMax()); S.log.push(`↩️ Left the ${WAGONS[k].name} behind`); save(); ui(); }
function finish(log) {
  const n = node(S.at), off = S.pax; S.pax = 0; log.push(`👋 All ${off} passengers arrived at ${n.name}`);
  const sold = S.goods.length; if (sold) { S.score += sold * 3; S.goods = []; log.push(`📦 The port bought ${sold} goods: +${sold * 3}`); }
  if (has('royal') && S.repair >= 6) { S.score += 30; log.push('👑 The Royal saloon arrived in style: +30'); }
  const bonus = S.repair * 2; S.score += bonus; log.push(`🔧 Train in good shape: +${bonus}`);
  S.log = log; S.phase = 'done'; save(); ui();
}

// ── drawing ──
const cv = document.getElementById('c'), x = cv.getContext('2d');
let W = 0, H = 0, DPR = 1, SC = 1, camY = 0, anim = null, trayH = 240;
function layout() { DPR = Math.min(2, devicePixelRatio || 1); W = innerWidth; H = innerHeight; cv.width = W * DPR; cv.height = H * DPR; cv.style.width = W + 'px'; cv.style.height = H + 'px'; SC = W / 412; trayH = document.getElementById('tray').offsetHeight; }
const wy = r => -r * ROW_H; // world y of a row (up is forward)
function scr(wx, wyv) { return [wx * SC, (wyv - camY) * SC + (H - trayH) * .72]; }
function legPath(a, b) { const p0 = [a.x, wy(a.row)], p3 = [b.x, wy(b.row)], p1 = [a.x, wy(a.row) - ROW_H * .45], p2 = [b.x, wy(b.row) + ROW_H * .45]; return t => { const u = 1 - t; return [u * u * u * p0[0] + 3 * u * u * t * p1[0] + 3 * u * t * t * p2[0] + t * t * t * p3[0], u * u * u * p0[1] + 3 * u * u * t * p1[1] + 3 * u * t * t * p2[1] + t * t * t * p3[1]]; }; }
function tree(px, py, s, v) { x.fillStyle = 'rgba(0,0,0,.2)'; x.beginPath(); x.ellipse(px + 2 * s, py + 3 * s, 7 * s, 4 * s, 0, 0, 7); x.fill(); x.fillStyle = '#6b4a2b'; x.fillRect(px - s, py, 2 * s, 5 * s); x.fillStyle = v < .5 ? '#3e7d34' : '#4f8f3a'; x.beginPath(); x.arc(px, py - 3 * s, 6.5 * s, 0, 7); x.fill(); x.fillStyle = 'rgba(255,255,255,.17)'; x.beginPath(); x.arc(px - 2 * s, py - 5 * s, 3 * s, 0, 7); x.fill(); }
function house(px, py, w, h, wall, roof) { x.fillStyle = 'rgba(0,0,0,.22)'; x.fillRect(px + 2, py + 2, w, h); x.fillStyle = wall; x.fillRect(px, py, w, h); x.fillStyle = roof; x.beginPath(); x.moveTo(px - w * .12, py + h * .45); x.lineTo(px + w / 2, py - h * .45); x.lineTo(px + w * 1.12, py + h * .45); x.fill(); x.fillStyle = '#5a86a8'; x.fillRect(px + w * .2, py + h * .6, w * .18, h * .22); x.fillRect(px + w * .62, py + h * .6, w * .18, h * .22); }
function smoke(px, py, s, t) { for (let k = 0; k < 3; k++) { const ph = (t / 1300 + k / 3) % 1; x.fillStyle = `rgba(245,245,245,${.55 * (1 - ph)})`; x.beginPath(); x.arc(px + ph * 6 * s, py - ph * 18 * s, s * (2 + ph * 4), 0, 7); x.fill(); } }
function mountain(px, py, s) { x.fillStyle = '#8c8577'; x.beginPath(); x.moveTo(px - 26 * s, py + 22 * s); x.lineTo(px, py - 24 * s); x.lineTo(px + 26 * s, py + 22 * s); x.fill(); x.fillStyle = 'rgba(0,0,0,.12)'; x.beginPath(); x.moveTo(px, py - 24 * s); x.lineTo(px + 26 * s, py + 22 * s); x.lineTo(px + 4 * s, py + 22 * s); x.fill(); x.fillStyle = '#f4f4f4'; x.beginPath(); x.moveTo(px - 8 * s, py - 10 * s); x.lineTo(px, py - 24 * s); x.lineTo(px + 8 * s, py - 10 * s); x.lineTo(px + 3 * s, py - 13 * s); x.lineTo(px - 2 * s, py - 9 * s); x.fill(); }
const WALLS = ['#e9dcc0', '#f2e6cf', '#e0cba5', '#ecd9c6'], ROOFS = ['#b8503c', '#8a4a3a', '#a35d3b', '#6d7a8a', '#3b6ea5'];
function drawStop(n, t) {
  const [px, py] = scr(n.x, wy(n.row)), s = SC, v = k => hash(S.seed, n.id, k);

    case 'ashford': case 'town': case 'fair': { const cnt = n.kind === 'ashford' ? 9 : 6; for (let k = 0; k < cnt; k++) { const ang = k / cnt * 6.28 + v(1) * 6, r = 30 + v(k + 10) * 16; house(px + Math.cos(ang) * r * s - 7 * s, py + Math.sin(ang) * r * .7 * s - 5 * s, 14 * s, 10 * s, WALLS[k % 4], ROOFS[(k + n.id) % 5]); } smoke(px + 30 * s, py - 20 * s, s, t + n.id * 300); if (n.kind === 'fair') { for (let k = 0; k < 6; k++) { x.fillStyle = ['#c9483b', '#e8a317', '#3b7fc4'][k % 3]; x.beginPath(); x.moveTo(px - 40 * s + k * 14 * s, py - 32 * s); x.lineTo(px - 33 * s + k * 14 * s, py - 32 * s); x.lineTo(px - 36 * s + k * 14 * s, py - 26 * s); x.fill(); } } break; }

const CARCOL = { coach: ['#7a1e1e', '#e9e0c8'], dining: ['#5a2a6e', '#f3d9a0'], tender: ['#2b2b2b', '#111'], plough: ['#c9483b', '#fafafa'], crane: ['#e8a317', '#555'], goods: ['#8a5a2b', '#a0743c'], mail: ['#c9483b', '#f2e6cf'], repair: ['#3f6f8f', '#d0d6dc'], band: ['#3f9d4b', '#e8c54a'], water: ['#3b7fc4', '#9cc5e8'], scope: ['#2d5f8a', '#c7e4f5'], royal: ['#5a2a6e', '#e8c54a'] };

// ── stop labels for the choice ──

// ── UI ──
const $ = id => document.getElementById(id);
