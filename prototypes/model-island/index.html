<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Railhaven · Model Railway Island</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#3f86b8;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#2c2a25;user-select:none;-webkit-user-select:none}
canvas{position:absolute;left:0;top:0;touch-action:none}
.hud{position:absolute;left:8px;right:8px;top:8px;display:flex;gap:6px;flex-wrap:wrap;pointer-events:none;z-index:2}
.chip{background:rgba(255,253,245,.96);border-radius:16px;padding:5px 10px;font-weight:700;font-size:14px;box-shadow:0 2px 5px rgba(0,0,0,.25);pointer-events:auto}
.wishes{position:absolute;left:8px;right:8px;display:flex;gap:6px;z-index:2;pointer-events:none}
.wish{flex:1;background:rgba(255,253,245,.94);border-radius:12px;padding:5px 8px;font-size:12.5px;font-weight:700;box-shadow:0 2px 5px rgba(0,0,0,.25);border-left:5px solid #e8a317}
.wish small{display:block;font-weight:500;color:#6a645a;font-size:11.5px}
.wish.done{border-left-color:#3f9d4b;background:#eaf7e6}
.tray{position:absolute;left:0;right:0;bottom:0;background:rgba(255,251,240,.98);border-radius:18px 18px 0 0;padding:10px 10px calc(12px + env(safe-area-inset-bottom));box-shadow:0 -3px 12px rgba(0,0,0,.3);z-index:3}
.tray h3{margin:0 0 2px;font-size:16px}
.tray p{margin:0 0 8px;font-size:12.5px;color:#6a645a;min-height:16px}
.cards{display:flex;gap:7px}
.card{flex:1;border-radius:14px;padding:8px 4px 7px;text-align:center;background:#fff;border:3px solid #e3dccb;box-shadow:0 2px 4px rgba(0,0,0,.12);cursor:pointer;transition:transform .12s}
.card.sel{border-color:#e8a317;background:#fff7e0;transform:translateY(-5px)}
.card .ic{font-size:30px;line-height:1.1}
.card b{display:block;font-size:13px;margin:3px 0 3px}
.card span{display:inline-block;font-size:11px;border-radius:10px;padding:2px 6px;margin:1px;color:#fff;font-weight:700;line-height:1.25}
.g{background:#3f9d4b}.o{background:#e08a1e}.b{background:#3b7fc4}.p{background:#8b5cc4}.r{background:#c9483b}.gr{background:#7d776b}
.btn{display:block;width:100%;margin-top:8px;text-align:center;background:#2f8f86;color:#fff;font-weight:800;border-radius:12px;padding:11px;font-size:15px;border:0;cursor:pointer}
.btn.off{background:#b9b2a4}
.btn2{background:#fff;color:#2f8f86;border:2px solid #2f8f86}
.pop{position:absolute;font-weight:800;font-size:16px;color:#fff;background:#3f9d4b;border-radius:12px;padding:1px 8px;box-shadow:0 2px 4px rgba(0,0,0,.3);pointer-events:none;z-index:2;transform:translate(-50%,-100%)}
.pop.neg{background:#c9483b}
.why{font-size:12.5px;line-height:1.5}
.why i{font-style:normal;font-weight:800;color:#3f9d4b}
.modal{position:absolute;inset:0;background:rgba(20,30,40,.55);display:flex;align-items:center;justify-content:center;z-index:5;padding:16px}
.sheet{background:#fffbf0;border-radius:18px;padding:18px;max-width:420px;width:100%;box-shadow:0 6px 20px rgba(0,0,0,.4);max-height:92%;overflow:auto}
.sheet h2{margin:0 0 6px;font-size:21px}
.sheet p{font-size:14px;line-height:1.45;margin:6px 0}
.rules{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:10px 0}
.rule{background:#fff;border-radius:10px;padding:6px 8px;font-size:12px;border:1px solid #eadfc8}
.rule b{font-size:13px}
.big{font-size:44px;font-weight:900;text-align:center;color:#e08a1e;margin:4px 0}
.toast{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#fffbf0;border-radius:14px;padding:12px 16px;font-weight:800;font-size:15px;box-shadow:0 4px 14px rgba(0,0,0,.4);z-index:4;text-align:center;pointer-events:none;transition:opacity .4s}
.help{position:absolute;right:8px;top:8px;z-index:3;background:rgba(255,253,245,.96);border-radius:50%;width:34px;height:34px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:17px;box-shadow:0 2px 5px rgba(0,0,0,.25);cursor:pointer}
</style></head><body>
<canvas id="c"></canvas>
<div class="hud" id="hud"></div>
<div class="help" id="helpBtn">?</div>
<div class="wishes" id="wishes"></div>
<div class="tray" id="tray"></div>
<div id="layer"></div>
<script>
'use strict';
// ───────────────────────── Model Railway Island ─────────────────────────
// Pick 1 of 3 pieces, place it next to what you have, score good neighbours.
const COLS = 9, ROWS = 12, START_PILE = 26, SAVE = 'rh-model-island-1';
const KINDS = {
  house:     { icon: '🏠', name: 'Cottages',    tags: [['g', '+1 per cottage beside'], ['b', '+1 on the line']], w: 9 },
  rail:      { icon: '🛤', name: 'Rails',       tags: [['b', 'links pieces to Ashford']], w: 9 },
  farm:      { icon: '🌾', name: 'Wheat field', tags: [['g', '+1 per field beside']], w: 6 },
  forest:    { icon: '🌲', name: 'Woods',       tags: [['g', '+1 per woods beside']], w: 5 },
  mill:      { icon: '🥖', name: 'Windmill',    tags: [['g', '+2 per field beside'], ['b', '+3 on the line']], w: 4 },
  sawmill:   { icon: '🪚', name: 'Sawmill',     tags: [['g', '+2 per woods beside'], ['b', '+3 on the line']], w: 4 },
  station:   { icon: '🚉', name: 'Station',     tags: [['p', '+2 per cottage near'], ['b', 'must join the line']], w: 4 },
  well:      { icon: '⛲', name: 'Well',        tags: [['p', '+1 per cottage near']], w: 3 },
  chapel:    { icon: '⛪', name: 'Chapel',      tags: [['p', '+1 per cottage within 2']], w: 3 },
  market:    { icon: '🎪', name: 'Market',      tags: [['o', '+1 per different neighbour'], ['b', '+2 on the line']], w: 3 },
  pasture:   { icon: '🐑', name: 'Sheep field', tags: [['g', '+2, +1 per sheep field'], ['r', '−1 per cottage beside']], w: 3 },
  quarry:    { icon: '🪨', name: 'Quarry',      tags: [['gr', 'rocky ground only'], ['b', '+3, +3 on the line']], w: 3, unlock: 60 },
  harbour:   { icon: '⚓', name: 'Harbour',     tags: [['gr', 'on the coast'], ['b', '+2, +4 on the line']], w: 3, unlock: 85 },
  lighthouse:{ icon: '🗼', name: 'Lighthouse',  tags: [['gr', 'on the coast'], ['p', '+1 per coast piece near']], w: 2, unlock: 85 },
  inn:       { icon: '🍺', name: 'Inn',         tags: [['p', '+3 next to a station'], ['g', '+1 per cottage beside']], w: 3, unlock: 110 },
  park:      { icon: '🌳', name: 'Park',        tags: [['g', '+1 per cottage, chapel or inn near']], w: 3, unlock: 135 },
};
const RAILY = new Set(['rail', 'station', 'ashford']);

// ── seeded random ──
let rs = 1; const rnd = () => (rs = (rs * 16807) % 2147483647) / 2147483647;
function hash(a, b, c) { let h = (a * 374761393 + b * 668265263 + c * 2147483647) | 0; h = (h ^ (h >>> 13)) * 1274126177; return ((h ^ (h >>> 16)) >>> 0) / 4294967296; }

// ── state ──
let S = null; // {seed, land[], rock[], cells[], pile, score, bonus, choices[], wishes[], picks4, turn}
let meta = JSON.parse(localStorage.getItem(SAVE + '-meta') || '{"best":0,"runs":0}');
const idx = (q, r) => r * COLS + q, qOf = i => i % COLS, rOf = i => (i / COLS) | 0;
function n4(i) { const q = qOf(i), r = rOf(i), o = []; if (q > 0) o.push(i - 1); if (q < COLS - 1) o.push(i + 1); if (r > 0) o.push(i - COLS); if (r < ROWS - 1) o.push(i + COLS); return o; }
function around(i, d = 1) { const q = qOf(i), r = rOf(i), o = []; for (let y = r - d; y <= r + d; y++) for (let x = q - d; x <= q + d; x++) if ((x !== q || y !== r) && x >= 0 && y >= 0 && x < COLS && y < ROWS) o.push(idx(x, y)); return o; }
const coast = i => S.land[i] && (qOf(i) === 0 || rOf(i) === 0 || qOf(i) === COLS - 1 || rOf(i) === ROWS - 1 || n4(i).some(j => !S.land[j]) || n4(i).length < 4);

function newRun() {
  const seed = (Date.now() % 100000) + 1; rs = seed;
  const land = [], rock = [];
  const cx = (COLS - 1) / 2, cy = (ROWS - 1) / 2;
  const ph = [rnd() * 6, rnd() * 6, rnd() * 6];
  for (let r = 0; r < ROWS; r++) for (let q = 0; q < COLS; q++) {
    const dx = (q - cx) / (COLS / 2 + .2), dy = (r - cy) / (ROWS / 2 + .2);
    const ang = Math.atan2(dy, dx), wob = .17 * Math.sin(ang * 3 + ph[0]) + .1 * Math.sin(ang * 5 + ph[1]);
    land.push(Math.hypot(dx, dy) < .93 + wob);
  }
  const ash = idx(Math.round(cx), Math.round(cy)); land[ash] = true;
  // a rocky ridge on one side
  const ra = rnd() * Math.PI * 2;
  for (let i = 0; i < land.length; i++) {
    const q = qOf(i), r = rOf(i), d = Math.hypot(q - cx - Math.cos(ra) * 2.6, (r - cy - Math.sin(ra) * 3.2));
    rock.push(land[i] && i !== ash && d < 1.1 + hash(seed, q, r) * .7);
  }
  const cells = land.map(() => null); cells[ash] = 'ashford';
  S = { seed, land, rock, cells, pile: START_PILE, score: 0, bonus: 0, choices: [], wishes: [], picks4: 0, turn: 0, wishN: 0 };
  S.wishes.push(newWish()); S.wishes.push(newWish());
  deal();
  save();
}
function unlocked() { return Object.keys(KINDS).filter(k => !KINDS[k].unlock || meta.best >= KINDS[k].unlock); }
function deal() {
  const ks = unlocked(), n = S.picks4 > 0 ? 4 : 3, out = [];
  // at least one rail early, so the line can grow
  if (S.turn < 6 && S.turn % 2 === 0) out.push('rail');
  while (out.length < n) {
    const tot = ks.reduce((a, k) => a + (out.includes(k) ? 0 : KINDS[k].w), 0);
    let r = Math.random() * tot;
    for (const k of ks) { if (out.includes(k)) continue; r -= KINDS[k].w; if (r <= 0) { out.push(k); break; } }
  }
  S.choices = out.sort(() => Math.random() - .5); if (S.picks4 > 0) S.picks4--;
  sel = 0; spot = -1;
}

// ── the line: rails joined to Ashford ──
function lineSet(cells) {
  const ash = cells.indexOf('ashford'), seen = new Set([ash]), st = [ash];
  while (st.length) { const i = st.pop(); for (const j of n4(i)) if (!seen.has(j) && RAILY.has(cells[j])) { seen.add(j); st.push(j); } }
  return seen;
}
const onLine = (cells, line, i) => n4(i).some(j => line.has(j));
function cluster(cells, i, k) { const seen = new Set([i]), st = [i]; while (st.length) { const a = st.pop(); for (const j of n4(a)) if (!seen.has(j) && cells[j] === k) { seen.add(j); st.push(j); } } return seen; }

// ── scoring: points each piece makes, with reasons ──
function piecePts(cells, line, i) {
  const k = cells[i], c4 = n4(i).map(j => cells[j]), c8 = around(i).map(j => cells[j]), cnt = (arr, kk) => arr.filter(x => x === kk).length;
  const on = onLine(cells, line, i) || line.has(i), why = []; let p = 0;
  const add = (v, t) => { if (v) { p += v; why.push([v, t]); } };
  switch (k) {
    case 'house': add(1, 'cottages'); add(cnt(c4, 'house'), 'cottages beside'); add(on ? 1 : 0, 'on the line'); break;
    case 'farm': add(1, 'field'); add(cnt(c4, 'farm'), 'fields beside'); break;
    case 'forest': add(1, 'woods'); add(cnt(c4, 'forest'), 'woods beside'); break;
    case 'mill': add(2 * cnt(c4, 'farm'), 'fields beside'); add(on ? 3 : 0, 'on the line'); break;
    case 'sawmill': add(2 * cnt(c4, 'forest'), 'woods beside'); add(on ? 3 : 0, 'on the line'); break;
    case 'station': if (line.has(i)) add(2 * cnt(c8, 'house'), 'cottages near'); break;
    case 'well': add(cnt(c8, 'house'), 'cottages near'); break;
    case 'chapel': add(cnt(around(i, 2).map(j => cells[j]), 'house'), 'cottages within 2'); break;
    case 'market': add(new Set(c8.filter(x => x && x !== 'rail')).size, 'different neighbours'); add(on ? 2 : 0, 'on the line'); break;
    case 'pasture': add(2, 'sheep'); add(cnt(c4, 'pasture'), 'sheep fields beside'); add(-cnt(c4, 'house'), 'cottages beside'); break;
    case 'quarry': add(3, 'stone'); add(on ? 3 : 0, 'on the line'); break;
    case 'harbour': add(2, 'boats'); add(on ? 4 : 0, 'on the line'); break;
    case 'lighthouse': add(around(i, 2).filter(j => cells[j] && cells[j] !== 'lighthouse' && coast(j)).length, 'coast pieces near'); break;
    case 'inn': add(c8.some(x => x === 'station' || x === 'ashford') ? 3 : 0, 'next to a station'); add(cnt(c4, 'house'), 'cottages beside'); break;
    case 'park': add(c8.filter(x => x === 'house' || x === 'chapel' || x === 'inn').length, 'cottages, chapels, inns near'); break;
  }
  return { p, why };
}
function total(cells) { const line = lineSet(cells); let t = 0; for (let i = 0; i < cells.length; i++) if (cells[i]) t += piecePts(cells, line, i).p; return t; }
function canPlace(k, i) {
  if (!S.land[i] || S.cells[i]) return false;
  if (!n4(i).some(j => S.cells[j])) return false;
  if (S.rock[i] && k !== 'quarry' && k !== 'rail') return false;
  if (k === 'quarry' && !S.rock[i]) return false;
  if ((k === 'harbour' || k === 'lighthouse') && !coast(i)) return false;
  return true;
}
function whyNot(k, i) {
  if (!S.land[i]) return 'That is the sea.';
  if (S.cells[i]) return 'Something is already there.';
  if (!n4(i).some(j => S.cells[j])) return 'Place it next to a piece you already have.';
  if (k === 'quarry' && !S.rock[i]) return 'A quarry needs rocky ground (the grey squares).';
  if (S.rock[i]) return 'Rocky ground only takes a quarry or rails.';
  if (k === 'harbour' || k === 'lighthouse') return 'This one goes on the coast, by the sea.';
  return '';
}
function preview(k, i) {
  const cells = S.cells.slice(); cells[i] = k; const line = lineSet(cells);
  const own = piecePts(cells, line, i), delta = total(cells) - S.score;
  return { own, delta, others: delta - own.p };
}

// ── wishes ──
const WISHES = [
  { id: 'hamlet', t: '🏘 A hamlet', d: '4 cottages touching', ok: c => c.some((k, i) => k === 'house' && cluster(c, i, 'house').size >= 4) },
  { id: 'millLine', t: '🥖 Flour by rail', d: 'a windmill on the line', ok: (c, l) => c.some((k, i) => k === 'mill' && onLine(c, l, i)) },
  { id: 'sawLine', t: '🪚 Timber by rail', d: 'a sawmill on the line', ok: (c, l) => c.some((k, i) => k === 'sawmill' && onLine(c, l, i)) },
  { id: 'busy', t: '🚉 A busy halt', d: 'a station with 3 cottages near', ok: (c, l) => c.some((k, i) => k === 'station' && l.has(i) && around(i).filter(j => c[j] === 'house').length >= 3) },
  { id: 'fields', t: '🌾 Golden acres', d: '4 wheat fields touching', ok: c => c.some((k, i) => k === 'farm' && cluster(c, i, 'farm').size >= 4) },
  { id: 'coast', t: '🌊 To the sea', d: 'rails reaching the coast', ok: (c, l) => [...l].some(i => c[i] === 'rail' && coast(i)) },
  { id: 'far', t: '🧭 Long line', d: 'the line 5 squares from Ashford', ok: (c, l) => { const a = c.indexOf('ashford'); return [...l].some(i => Math.abs(qOf(i) - qOf(a)) + Math.abs(rOf(i) - rOf(a)) >= 5); } },
  { id: 'village', t: '⛪ Village life', d: 'a chapel and a well', ok: c => c.includes('chapel') && c.includes('well') },
  { id: 'market', t: '🎪 Fair day', d: 'a market with 4 different neighbours', ok: c => c.some((k, i) => k === 'market' && new Set(around(i).map(j => c[j]).filter(x => x && x !== 'rail')).size >= 4) },
  { id: 'flock', t: '🐑 Shepherds', d: '3 sheep fields touching', ok: c => c.some((k, i) => k === 'pasture' && cluster(c, i, 'pasture').size >= 3) },
  { id: 'quarry', t: '🪨 Stone for the city', d: 'a quarry on the line', ok: (c, l) => c.some((k, i) => k === 'quarry' && onLine(c, l, i)), need: 'quarry' },
  { id: 'port', t: '⚓ Port town', d: 'a harbour on the line', ok: (c, l) => c.some((k, i) => k === 'harbour' && onLine(c, l, i)), need: 'harbour' },
];
function newWish() {
  const have = new Set((S.wishes || []).map(w => w.id)), ks = unlocked();
  const pool = WISHES.filter(w => !have.has(w.id) && !(S.done || []).includes(w.id) && (!w.need || ks.includes(w.need)));
  const w = pool[Math.floor(Math.random() * pool.length)] || WISHES[0];
  return { id: w.id };
}
function checkWishes() {
  const line = lineSet(S.cells), got = [];
  S.wishes = S.wishes.map(w => {
    const def = WISHES.find(d => d.id === w.id);
    if (def.ok(S.cells, line)) { got.push(def); S.done = [...(S.done || []), w.id]; return null; }
    return w;
  });
  for (let n = 0; n < S.wishes.length; n++) if (!S.wishes[n]) { S.wishes[n] = { id: '' }; S.wishes[n] = newWish(); }
  for (const g of got) { S.bonus += 5; S.pile += 2; S.picks4 = 1; S.wishN++; }
  return got;
}

// ── layout + drawing ──
const cv = document.getElementById('c'), x = cv.getContext('2d');
let W = 0, H = 0, T = 40, OX = 0, OY = 0, DPR = 1, sel = 0, spot = -1, trayH = 220;
function layout() {
  DPR = Math.min(2, window.devicePixelRatio || 1); W = innerWidth; H = innerHeight;
  cv.width = W * DPR; cv.height = H * DPR; cv.style.width = W + 'px'; cv.style.height = H + 'px';
  trayH = document.getElementById('tray').offsetHeight || 220;
  const top = 104, availH = H - trayH - top - 6;
  T = Math.floor(Math.min((W - 12) / COLS, availH / ROWS));
  OX = Math.floor((W - T * COLS) / 2); OY = top + Math.floor((availH - T * ROWS) / 2);
  document.getElementById('wishes').style.top = (44) + 'px';
}
function noiseDots(px, py, s, seed, a, b, n = 10) { for (let k = 0; k < n; k++) { const h1 = hash(seed, k, 1), h2 = hash(seed, k, 2); x.fillStyle = hash(seed, k, 3) < .5 ? a : b; x.fillRect(px + h1 * s, py + h2 * s, s * .06 + 1, s * .06 + 1); } }
function tree(px, py, s, seed = 0) { x.fillStyle = 'rgba(0,0,0,.2)'; x.beginPath(); x.ellipse(px + s * .05, py + s * .1, s * .14, s * .08, 0, 0, 7); x.fill(); x.fillStyle = '#6b4a2b'; x.fillRect(px - s * .02, py, s * .04, s * .1); x.fillStyle = hash(seed, px | 0, py | 0) < .5 ? '#3e7d34' : '#4f8f3a'; x.beginPath(); x.arc(px, py - s * .05, s * .13, 0, 7); x.fill(); x.fillStyle = 'rgba(255,255,255,.17)'; x.beginPath(); x.arc(px - s * .04, py - s * .09, s * .06, 0, 7); x.fill(); }
function house(px, py, w, h, wall = '#e9dcc0', roof = '#b8503c') {
  x.fillStyle = 'rgba(0,0,0,.22)'; x.fillRect(px + 2, py + 2, w, h);
  x.fillStyle = wall; x.fillRect(px, py, w, h);
  x.fillStyle = roof; x.beginPath(); x.moveTo(px - w * .12, py + h * .45); x.lineTo(px + w / 2, py - h * .45); x.lineTo(px + w * 1.12, py + h * .45); x.closePath(); x.fill();
  x.fillStyle = 'rgba(0,0,0,.14)'; x.beginPath(); x.moveTo(px + w / 2, py - h * .45); x.lineTo(px + w * 1.12, py + h * .45); x.lineTo(px + w / 2, py + h * .45); x.fill();
  x.fillStyle = '#5a86a8'; x.fillRect(px + w * .2, py + h * .6, w * .18, h * .22); x.fillRect(px + w * .62, py + h * .6, w * .18, h * .22);
}
function person(px, py, s, col) { x.fillStyle = col; x.fillRect(px - s * .025, py - s * .06, s * .05, s * .07); x.fillStyle = '#f0c9a0'; x.beginPath(); x.arc(px, py - s * .085, s * .025, 0, 7); x.fill(); }
const WALLS = ['#e9dcc0', '#f2e6cf', '#e0cba5', '#ecd9c6'], ROOFS = ['#b8503c', '#8a4a3a', '#a35d3b', '#6d7a8a'];
function railLinks(i, cells) { return n4(i).filter(j => RAILY.has(cells[j])).map(j => j === i - 1 ? 'W' : j === i + 1 ? 'E' : j === i - COLS ? 'N' : 'S'); }
function drawRails(px, py, s, links, ties = true) {
  const c = [px + s / 2, py + s / 2], end = { N: [px + s / 2, py], S: [px + s / 2, py + s], W: [px, py + s / 2], E: [px + s, py + s / 2] };
  if (!links.length) links = ['W', 'E'];
  if (links.length === 1) links = [links[0], { N: 'S', S: 'N', W: 'E', E: 'W' }[links[0]]];
  const paths = [];

  for (const k of Object.keys(KINDS)) if (KINDS[k].unlock && prevBest < KINDS[k].unlock && meta.best >= KINDS[k].unlock) unl.push(k);
  localStorage.setItem(SAVE + '-meta', JSON.stringify(meta));
  const next = Object.keys(KINDS).filter(k => KINDS[k].unlock && meta.best < KINDS[k].unlock).sort((a, b) => KINDS[a].unlock - KINDS[b].unlock)[0];
  $('tray').innerHTML = `<h3>🏁 Island finished</h3><p>${S.wishN} wishes granted · ${S.cells.filter(Boolean).length} pieces placed</p><button class="btn" id="again">⛵ Sail to a new island</button>`;
  $('again').onclick = () => { localStorage.removeItem(SAVE); newRun(); hud(); tray(); layout(); };
  const m = document.createElement('div'); m.className = 'modal'; m.innerHTML = `<div class="sheet"><h2>🏁 Your island is complete</h2><div class="big">⭐ ${final}</div>
  <p style="text-align:center">${final > prevBest ? '🏆 New best score!' : `Best so far: ${meta.best}`}</p>
  ${unl.length ? `<p>🔓 New pieces join the pile: ${unl.map(k => `<b>${KINDS[k].icon} ${KINDS[k].name}</b>`).join(', ')}</p>` : ''}
  ${next ? `<p>Next new piece at ⭐ ${KINDS[next].unlock}: ${KINDS[next].icon} ${KINDS[next].name}</p>` : '<p>Every piece is unlocked. Chase your best score!</p>'}
  <button class="btn" id="m1">⛵ Sail to a new island</button><button class="btn btn2" id="m2">Look at my island</button></div>`;
  document.body.appendChild(m);
  $('m1').onclick = () => { m.remove(); localStorage.removeItem(SAVE); newRun(); hud(); tray(); layout(); };
  $('m2').onclick = () => m.remove();
}
function help(first) {
  const m = document.createElement('div'); m.className = 'modal';
  m.innerHTML = `<div class="sheet"><h2>🚂 Model Railway Island</h2>
  <p>Build a little island like a model railway on a table. Each turn you <b>pick 1 of 3 pieces</b> and place it next to what you have. The pieces are shuffled, so you never know what comes next.</p>
  <p>Pieces score for <b>good neighbours</b>. Before you place one, the card shows exactly what it will earn.</p>
  <p><b>🛤 Rails</b> join pieces to <b>Ashford</b>. Pieces beside the line score more, and a little train runs it.</p>
  <p><b>✨ Wishes</b> at the top give +5 points, 2 extra pieces and a 1-of-4 pick.</p>
  <p>When the pile runs out, the island is done. Good scores add new pieces for your next island.</p>
  <div class="rules">${Object.keys(KINDS).map(k => `<div class="rule"><b>${KINDS[k].icon} ${KINDS[k].name}</b><br>${KINDS[k].tags.map(t => t[1]).join(', ')}${KINDS[k].unlock ? `<br><i>unlocks at ⭐ ${KINDS[k].unlock}</i>` : ''}</div>`).join('')}</div>
  <button class="btn" id="hok">${first ? 'Start building' : 'Back to my island'}</button></div>`;
  document.body.appendChild(m); $('hok').onclick = () => m.remove();
}
$('helpBtn').onclick = () => help(false);
function save() { localStorage.setItem(SAVE, JSON.stringify(S)); }
cv.addEventListener('pointerdown', e => {
  if (S.pile <= 0) return;
  const q = Math.floor((e.clientX - OX) / T), r = Math.floor((e.clientY - OY) / T);
  if (q < 0 || r < 0 || q >= COLS || r >= ROWS) { spot = -1; tray(); return; }
  const i = idx(q, r); spot = (spot === i && canPlace(S.choices[sel], i)) ? (place(), -1) : i; if (S.pile > 0) tray();
});
addEventListener('resize', layout);
// ── start ──
try { S = JSON.parse(localStorage.getItem(SAVE) || 'null'); } catch { S = null; }
if (!S || !S.cells) { newRun(); setTimeout(() => help(true), 50); }
S.score = total(S.cells);
hud(); tray(); layout(); requestAnimationFrame(draw);
if (S.pile <= 0) end();
window.MI = { get S() { return S; }, get geo() { return { OX, OY, T }; }, total, preview, canPlace, place: (k, i) => { sel = S.choices.indexOf(k); spot = i; place(); } };
</script>
