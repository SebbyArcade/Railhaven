<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Railhaven</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2a1f14">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  html, body { margin: 0; height: 100%; background: #15130f; overflow: hidden; font-family: system-ui, sans-serif; color: #f3e6c8; overscroll-behavior: none; }
  canvas { display: block; position: fixed; inset: 0; }
  #hud { position: fixed; top: max(8px, env(safe-area-inset-top)); left: 8px; display: flex; gap: 6px; pointer-events: none; }
  .chip { background: rgba(28,22,16,.88); border: 1px solid #6b5132; border-radius: 14px; padding: 4px 10px; font-weight: 600; font-size: 14px; }
  .chip.money { color: #ffd27a; }
  #toast { position: fixed; left: 50%; top: calc(max(8px, env(safe-area-inset-top)) + 70px); transform: translateX(-50%); background: rgba(28,22,16,.94); border: 1px solid #c99a5b; border-radius: 12px; padding: 8px 14px; font-size: 14px; opacity: 0; transition: opacity .3s; pointer-events: none; max-width: 86vw; text-align: center; }
  #bar { position: fixed; bottom: max(10px, env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); display: flex; gap: 6px; }
  #bar button { background: #3a2a18; color: #ffe9c4; border: 1px solid #c99a5b; border-radius: 12px; padding: 8px 10px; font-size: 14px; font-weight: 600; min-width: 52px; }
  #bar:has(#shipsBtn:not([style*="none"])) button { font-size: 11px; } /* nine buttons once there are ships */
  @media (max-width: 480px) { #bar { gap: 3px; width: 98vw; } #bar button { flex: 1; padding: 7px 1px; font-size: 12px; min-width: 0; } }
  #bar button.on { background: #e8a33c; color: #2a1c0c; border-color: #ffd27a; }
  #hint { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(max(10px, env(safe-area-inset-bottom)) + 56px); width: min(92vw, 520px); background: rgba(28,22,16,.9); border: 1px solid #6b5132; border-radius: 12px; padding: 8px 12px; font-size: 13px; display: none; box-sizing: border-box; }
  #confirm { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(max(10px, env(safe-area-inset-bottom)) + 108px); width: min(92vw, 520px); background: #2a1f14; border: 2px solid #c99a5b; border-radius: 14px; padding: 8px 10px; display: none; align-items: center; gap: 8px; box-sizing: border-box; }
  #confirm span { flex: 1; font-size: 14px; font-weight: 600; }
  #buildMenu { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(max(10px, env(safe-area-inset-bottom)) + 58px); width: min(94vw, 520px); max-height: 60vh; overflow-y: auto; display: none; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 6px; background: rgba(28,22,16,.94); border: 1px solid #6b5132; border-radius: 14px; padding: 8px; box-sizing: border-box; }
  #buildMenu button { background: #3a2a18; color: #ffe9c4; border: 2px solid #6b5132; border-radius: 12px; padding: 6px; text-align: left; font-size: 13px; line-height: 1.25; }
  #buildMenu button.on { border-color: #ffd27a; background: #5a3f1e; }
  #buildMenu button b { font-size: 20px; float: left; margin-right: 6px; }
  #buildMenu button small { opacity: .75; display: block; }
  #buildMenu button.locked { opacity: .55; border-style: dashed; }
  #buildMenu button .rcp { display: block; clear: both; width: fit-content; max-width: 100%; box-sizing: border-box; white-space: nowrap; margin-top: 4px; padding: 1px 6px; font-size: 13px; background: #241a10; border: 1px solid #6b5132; border-radius: 9px; }
  #buildMenu .mhead { grid-column: 1 / -1; font-size: 12px; font-weight: 700; color: #ffd27a; margin-top: 2px; }
  #card .vol { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 8px; background: #2a2016; border: 1px solid #6b5132; border-radius: 12px; padding: 6px 10px; font-weight: 600; font-size: 14px; }
  #card .vbars { display: flex; align-items: flex-end; gap: 0; }
  #card .vb { width: 30px; height: 38px; padding: 0 4px; border: 0; background: none; display: flex; align-items: flex-end; }
  #card .vb i { display: block; width: 100%; border-radius: 4px; border: 1px solid #8a6a3e; background: #15110c; }
  #card .vb.on i { background: linear-gradient(#ffd27a, #e8a33c); border-color: #ffd27a; }
  #mute { position: fixed; top: calc(max(8px, env(safe-area-inset-top)) + 38px); right: 8px; width: 34px; height: 30px; padding: 0; background: rgba(28,22,16,.88); border: 1px solid #6b5132; border-radius: 14px; font-size: 15px; line-height: 28px; z-index: 5; }
  #mute.off { border-color: #e0664f; background: rgba(90,42,34,.9); }
  #undo { position: fixed; right: 12px; bottom: calc(max(10px, env(safe-area-inset-bottom)) + 166px); display: none; background: #3a2c1c; color: #ffe9c4; border: 2px solid #c99a5b; border-radius: 12px; padding: 8px 12px; font-size: 14px; font-weight: 700; }
  #confirm button { border-radius: 10px; padding: 9px 12px; font-size: 14px; font-weight: 700; border: 0; }
  #ok { background: #4caf50; color: #fff; } #ok:disabled { background: #555; color: #aaa; }
  #cancel { background: #5a4632; color: #ffe9c4; }
  #turn { background: #2f6f9a; color: #fff; display: none; }
  #near { background: #8a5a2b; color: #fff; display: none; }
  #confirm.two { flex-wrap: wrap; justify-content: flex-end; } #confirm.two span { flex: 1 1 100%; order: -1; } #confirm #turn { margin-right: auto; }
  .chip.pos { color: #9be28f; } .chip.neg { color: #ff9a85; }
  #card { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(max(10px, env(safe-area-inset-bottom)) + 56px); width: min(94vw, 440px); max-height: 52vh; overflow-y: auto; background: rgba(32,24,16,.96); border: 2px solid #c99a5b; border-radius: 16px; padding: 10px 12px 12px; box-sizing: border-box; display: none; font-size: 14px; }
  @media (min-width: 700px) { #card { left: auto; right: 10px; transform: none; top: 52px; bottom: 70px; max-height: none; width: 360px; }
    /* a side card is open: messages centre over the map beside it, never over the card */
    body:has(#card[style*="block"]) #toast { left: calc((100vw - 380px) / 2); max-width: calc(100vw - 420px); } }
  /* the home screen: the card fills the screen over the paused map */
  #card.home { inset: 0; left: 0; right: 0; top: 0; bottom: 0; transform: none; width: auto; max-height: none; border: 0; border-radius: 0; background: rgba(21,17,11,.80); backdrop-filter: blur(3px); padding: max(14px, env(safe-area-inset-top)) max(14px, calc(50vw - 260px)) 18px; z-index: 27; }
  #toast { z-index: 40; }
  #card.home .pair input { flex: 2; } #card.home .pair .act { flex: 1; font-size: 15px; }
  #card.home .title { text-align: center; margin: 4vh 0 14px; } #card.home .title b { font-size: 46px; } #card.home .title h1 { margin: 2px 0; font-size: 30px; color: #ffe2a8; letter-spacing: .5px; } #card.home .title span { opacity: .8; font-size: 13px; }
  #card.home .tile { font-size: 16px; padding: 14px 10px; }
  #card .slot { display: flex; gap: 10px; align-items: center; width: 100%; text-align: left; margin: 6px 0; padding: 8px 10px; border-radius: 14px; border: 1.5px solid #8a6a3e; background: #2f2416; color: #f3e6c8; font: inherit; }
  #card .slot.on { border-color: #6fbf73; background: #24301f; } #card .slot.new { border-style: dashed; }
  #card .slot.cont { border: 2px solid #ffd27a; background: #3a2c16; padding: 10px 12px; } #card .slot.cont .sname { font-size: 19px; color: #ffd27a; }
  #card .spic { width: 64px; height: 64px; flex: none; border-radius: 10px; border: 1px solid #6b5132; background: #1c1912; display: flex; align-items: center; justify-content: center; font-size: 28px; image-rendering: pixelated; }
  #card .sname { display: block; font-weight: 700; font-size: 15px; } #card .sname2 { display: block; font-weight: 600; }
  #card .row.won { border-left-color: #ffd27a; } #card .slot.look { padding: 7px 10px; } #card .slot.locked { opacity: .6; border-style: dashed; }
  #card .sws { display: flex; gap: 3px; flex: none; } #card .sw { display: block; width: 14px; height: 30px; border-radius: 4px; border: 1px solid rgba(0,0,0,.4); }
  #card input { flex: 1; min-width: 0; margin-top: 8px; padding: 9px; border-radius: 10px; border: 1px solid #8a6a3e; background: #15110c; color: #f3e6c8; font: inherit; font-size: 15px; }
  #card .x { position: absolute; right: 8px; top: 8px; background: #5a4632; color: #ffe9c4; border: 0; border-radius: 10px; width: 32px; height: 32px; font-size: 15px; }
  #card .head { display: flex; gap: 10px; align-items: center; margin-bottom: 6px; padding-right: 36px; }
  #card .big { font-size: 30px; }
  #card h2 { margin: 0 0 3px; font-size: 18px; color: #ffe2a8; }
  #card h3 { margin: 10px 0 4px; font-size: 14px; color: #ffd27a; }
  .chip2 { display: inline-block; background: #4a3620; border: 1px solid #8a6a3e; border-radius: 10px; padding: 1px 8px; font-size: 12px; font-weight: 600; margin: 1px 2px 1px 0; }
  #card .row { display: flex; gap: 8px; align-items: flex-start; background: #2a1f14; border-radius: 12px; padding: 6px 8px; margin: 4px 0; border-left: 4px solid #8a6a3e; }
  #card .ico { font-size: 22px; width: 28px; text-align: center; }
  #card .grow { flex: 1; min-width: 0; }
  #card .line { display: flex; justify-content: space-between; font-weight: 600; }
  #card small { opacity: .85; font-size: 12px; display: block; margin-top: 2px; }
  .bar { height: 8px; background: #15110c; border-radius: 5px; overflow: hidden; margin-top: 3px; } .bar i { display: block; height: 100%; border-radius: 5px; }
  #card .warn { background: #5a2a1e; border: 1px solid #e0584a; border-radius: 12px; padding: 6px 9px; margin: 6px 0; font-weight: 600; }
  #card .find { text-align: center; } #card .find .rar { display: inline-block; padding: 3px 12px; border: 1.5px solid; border-radius: 12px; font-weight: 800; font-size: 12px; letter-spacing: .06em; } #card .find small { display: block; opacity: .75; } #card .find .fbig { display: block; font-size: 46px; margin: 6px 0 0; } #card .find h2 { margin: 2px 0; }
  #buildMenu .rec { grid-column: 1 / -1; border-color: #ffd24a; background: #3a3016; }
  #card .gift, #card .note { background: #23301e; border: 1px solid #5cc46a; border-radius: 12px; padding: 6px 9px; margin: 6px 0; font-weight: 600; }
  #card .note.big2 { font-size: 15px; }
  #card .act { width: 100%; margin-top: 8px; background: #2f8f8a; color: #fff; border: 0; border-radius: 12px; padding: 10px; font-size: 15px; font-weight: 700; }
  #card .act:disabled { background: #555; color: #bbb; }
  #card .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 8px; }
  #card .tile { background: #3a2a1a; border: 1px solid #8a6a3e; border-radius: 12px; padding: 9px 8px; color: #fff; text-align: left; display: flex; flex-direction: column; gap: 2px; font-size: 15px; }
  #card .tile.on { border-color: #6fbf73; } #card .tile small { color: #e8d8b8; font-size: 12px; } #card .tile.alert { border-color: #e0584a; background: #4a2418; }
  #card .act.back { background: #5a4630; }
  #card .pair { display: flex; gap: 6px; } #card .pair .act { font-size: 13px; padding: 9px 6px; }
  #card .act.alt { background: #b8862e; } #card .act.warnb { background: #a8402e; }
  #card .act.sure { background: #e0402a; animation: pulse 0.8s infinite alternate; }
  @keyframes pulse { to { filter: brightness(1.25); } }
  #card .mini { margin-top: 5px; background: #3a3020; color: #ffd27a; border: 1px solid #8a6a2a; border-radius: 9px; padding: 4px 9px; font-size: 12px; font-weight: 700; }
  #card .mini.on { background: #8a6a2a; color: #fff; } #card .mini:disabled { opacity: .45; }
  #card .btns { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 2px; } #card .mini.buy { background: #2f6b3a; color: #fff; border-color: #5cc46a; } #card .mini.sell { background: #6b4a1f; color: #ffe2a8; border-color: #e8a33c; } #card .mini.sure { background: #8a2a2a; color: #fff; border-color: #e85c5c; }
  #card .chips { display: flex; flex-wrap: wrap; gap: 4px; } #card .chip2.ok { background: #2e4a26; border-color: #5cc46a; } #card .chip2.bad { background: #5a2a22; border-color: #e0664f; } #card .row.alert { border-left-color: #e0664f; }
  #hud .chip.tap { pointer-events: auto; cursor: pointer; }
  #viewTag { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(max(10px, env(safe-area-inset-bottom)) + 56px); width: max-content; display: none; align-items: center; gap: 8px; background: rgba(28,22,16,.94); border: 1.5px solid #ffd27a; border-radius: 12px; padding: 6px 6px 6px 12px; font-size: 13px; max-width: 92vw; z-index: 6; }
  #viewTag button { background: #3a2a18; color: #ffe9c4; border: 1px solid #c99a5b; border-radius: 9px; padding: 4px 9px; font-weight: 700; }
  #card .vchips { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 4px; }
  #card .vchip { padding: 9px 11px; border-radius: 11px; border: 1.5px solid #4a3f2e; background: #2f271d; color: #f3e6c8; font: inherit; font-size: 14px; font-weight: 600; }
  #card .vchip.on { border-color: #ffd27a; background: #4a3b22; }
  #card #mapQ { display: block; width: 100%; box-sizing: border-box; margin: 4px 0 6px; padding: 9px; border-radius: 9px; border: 1px solid #6b5a3e; background: #1f1a13; color: #f3e6c8; font: inherit; font-size: 15px; }
  #card .ghead { margin-top: 8px; font-weight: 700; color: #ffd27a; } #card .ghead span { opacity: .6; font-weight: 500; }
  #card .goto { display: block; width: 100%; text-align: left; margin: 3px 0; padding: 9px 10px; border-radius: 9px; border: 1px solid #4a3f2e; background: #2f271d; color: #f3e6c8; font: inherit; font-size: 14px; } #card .goto span { opacity: .6; font-size: 12px; }
  #paused { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(15,12,8,.55); z-index: 30; }
  #paused div { background: rgba(32,24,16,.97); border: 2px solid #c99a5b; border-radius: 16px; padding: 14px 18px; text-align: center; font-weight: 700; font-size: 16px; }
  #mission { position: fixed; top: calc(max(8px, env(safe-area-inset-top)) + 34px); left: 8px; max-width: min(calc(100vw - 58px), 440px); display: none; align-items: center; gap: 6px; background: rgba(40,28,14,.92); border: 1px solid #e8a33c; border-radius: 14px; padding: 3px 4px 3px 10px; font-size: 13px; font-weight: 600; color: #ffe9c4; box-sizing: border-box; }
  #mission .mtext { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } #mission b { color: #ffd27a; }
  #mission button { background: #2f8f8a; color: #fff; border: 0; border-radius: 10px; padding: 5px 10px; font-size: 13px; font-weight: 700; flex: none; }
  #mission.lesson { max-width: min(calc(100vw - 54px), 460px); padding: 8px 10px; border-width: 2px; }
  #mission .les { display: flex; gap: 8px; align-items: flex-start; } #mission .lic { font-size: 28px; line-height: 1; }
  #mission .lbody { flex: 1; font-weight: 500; font-size: 13px; line-height: 1.35; } #mission .lbody .cap { letter-spacing: 1px; opacity: .75; font-size: 11px; display: block; }
  #mission .lt { display: block; font-size: 15px; color: #ffe2a8; } #mission .lbody i { display: block; opacity: .85; font-size: 12px; margin: 1px 0 3px; }
  #mission .lbtn { display: flex; gap: 10px; align-items: center; margin-top: 6px; } #mission .lbtn button { background: #ffd27a; color: #2a1c08; }
  #mission .lbtn button.skip { background: none; color: #e8d8b8; text-decoration: underline; font-weight: 500; font-size: 12px; padding: 4px; }
  #mission .nice { color: #7fd36b; font-weight: 800; }
  #tip { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(max(8px, env(safe-area-inset-bottom)) + 74px); width: min(calc(100vw - 16px), 460px); display: none; align-items: center; gap: 8px; background: rgba(28,40,22,.95); border: 2px solid #9bd36b; border-radius: 14px; padding: 7px 8px 7px 10px; font-size: 13px; line-height: 1.35; color: #eef7dc; box-sizing: border-box; z-index: 6; }
  #tip .tic { font-size: 22px; line-height: 1; } #tip .tt { flex: 1; min-width: 0; }
  #tip button { border: 0; border-radius: 10px; padding: 6px 10px; font-size: 13px; font-weight: 700; flex: none; background: #2f8f8a; color: #fff; }
  #tip button.x { background: none; color: #cfe3b8; font-size: 16px; padding: 4px 6px; } #tip button.off { background: #6b4a2a; }
  .tutHi { outline: 4px solid #ffd27a !important; box-shadow: 0 0 16px 4px #ffd27acc !important; }
  #tutPtr { position: fixed; z-index: 25; pointer-events: none; text-align: center; transform: translateX(-50%); font-weight: 800; color: #ffd27a; text-shadow: 0 1px 3px #000, 0 0 8px #000; font-size: 13px; display: none; white-space: nowrap; }
  #tutPtr span { display: block; font-size: 34px; line-height: 1; animation: tutB .8s ease-in-out infinite; }
  @keyframes tutB { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(9px); } }
  #tutPtr.up span { animation-name: tutU; } @keyframes tutU { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-9px); } }
  #card .mira { font-style: italic; color: #f0dcb0; font-size: 13px; margin: 2px 0 6px; }
  #card .row.main { border-left-color: #e8a33c; background: #33240f; } #card .row.side { border-left-color: #6a9ad0; align-items: center; } #card .row.ok { border-left-color: #5cc46a; }
  #card small.say { font-style: italic; color: #f0dcb0; }
  #card .actcard { text-align: center; padding: 4px 8px 0; } #card .actcard .aic { font-size: 40px; } #card .actcard .cap { letter-spacing: 2px; opacity: .75; }
  #card .actcard h2 { font-family: Georgia, serif; font-size: 22px; margin: 4px 0; } #card .actcard p { font-size: 15px; line-height: 1.4; margin: 6px 0; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"></div>
<button id="mute" aria-label="Sound on or off">🔊</button>
<div id="paused"><div>⏸ Paused while you were away<br><small style="font-weight:500">Tap anywhere to carry on</small></div></div>
<div id="mission"></div>
<div id="tutPtr"></div>
<div id="toast"></div>
<div id="tip"></div>
<div id="hint"></div>
<div id="viewTag"><span></span><button data-v="">✕</button></div>
<button id="undo">↶ Undo</button>
<div id="confirm"><button id="turn">⟳ Turn</button><span id="ctext"></span><button id="near">📍 Fit</button><button id="ok">✓ Build</button><button id="cancel">✕</button></div>
<div id="buildMenu"></div>
<div id="card"></div>
<div id="bar">
  <button id="buildBtn">🏗 Build</button>
  <button data-mode="rail">🛤 Rails</button>
  <button data-mode="double">═ Double</button>
  <button data-mode="remove">✂ Remove</button>
  <button data-mode="train">🚂 Train</button>
  <button id="shipsBtn" style="display:none">🚢 Ships</button>
  <button data-mode="scout">🔭 Scout</button>
  <button id="mapBtn">👁 Map</button>
  <button id="newGame">🏠 Home</button>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
