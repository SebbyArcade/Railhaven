<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Railhaven</title>
<style>
  html, body { margin: 0; height: 100%; background: #15130f; overflow: hidden; font-family: system-ui, sans-serif; color: #f3e6c8; overscroll-behavior: none; }
  canvas { display: block; position: fixed; inset: 0; }
  #hud { position: fixed; top: max(8px, env(safe-area-inset-top)); left: 8px; display: flex; gap: 6px; pointer-events: none; }
  .chip { background: rgba(28,22,16,.88); border: 1px solid #6b5132; border-radius: 14px; padding: 4px 10px; font-weight: 600; font-size: 14px; }
  .chip.money { color: #ffd27a; }
  #toast { position: fixed; left: 50%; top: calc(max(8px, env(safe-area-inset-top)) + 54px); transform: translateX(-50%); background: rgba(28,22,16,.94); border: 1px solid #c99a5b; border-radius: 12px; padding: 8px 14px; font-size: 14px; opacity: 0; transition: opacity .3s; pointer-events: none; max-width: 86vw; text-align: center; }
  #bar { position: fixed; bottom: max(10px, env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); display: flex; gap: 6px; }
  #bar button { background: #3a2a18; color: #ffe9c4; border: 1px solid #c99a5b; border-radius: 12px; padding: 8px 10px; font-size: 14px; font-weight: 600; min-width: 52px; }
  #bar button.on { background: #e8a33c; color: #2a1c0c; border-color: #ffd27a; }
  #hint { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(max(10px, env(safe-area-inset-bottom)) + 56px); width: min(92vw, 520px); background: rgba(28,22,16,.9); border: 1px solid #6b5132; border-radius: 12px; padding: 8px 12px; font-size: 13px; display: none; box-sizing: border-box; }
  #confirm { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(max(10px, env(safe-area-inset-bottom)) + 108px); width: min(92vw, 520px); background: #2a1f14; border: 2px solid #c99a5b; border-radius: 14px; padding: 8px 10px; display: none; align-items: center; gap: 8px; box-sizing: border-box; }
  #confirm span { flex: 1; font-size: 14px; font-weight: 600; }
  #buildMenu { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(max(10px, env(safe-area-inset-bottom)) + 58px); width: min(94vw, 520px); max-height: 60vh; overflow-y: auto; display: none; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 6px; background: rgba(28,22,16,.94); border: 1px solid #6b5132; border-radius: 14px; padding: 8px; box-sizing: border-box; }
  #buildMenu button { background: #3a2a18; color: #ffe9c4; border: 2px solid #6b5132; border-radius: 12px; padding: 6px; text-align: left; font-size: 13px; line-height: 1.25; }
  #buildMenu button.on { border-color: #ffd27a; background: #5a3f1e; }
  #buildMenu button b { font-size: 20px; float: left; margin-right: 6px; }
  #buildMenu button small { opacity: .75; display: block; }
  #buildMenu button.locked { opacity: .55; border-style: dashed; }
  #buildMenu .mhead { grid-column: 1 / -1; font-size: 12px; font-weight: 700; color: #ffd27a; margin-top: 2px; }
  #undo { position: fixed; right: 12px; bottom: calc(max(10px, env(safe-area-inset-bottom)) + 166px); display: none; background: #3a2c1c; color: #ffe9c4; border: 2px solid #c99a5b; border-radius: 12px; padding: 8px 12px; font-size: 14px; font-weight: 700; }
  #confirm button { border-radius: 10px; padding: 9px 12px; font-size: 14px; font-weight: 700; border: 0; }
  #ok { background: #4caf50; color: #fff; } #ok:disabled { background: #555; color: #aaa; }
  #cancel { background: #5a4632; color: #ffe9c4; }
  #turn { background: #2f6f9a; color: #fff; display: none; }
  .chip.pos { color: #9be28f; } .chip.neg { color: #ff9a85; }
  #card { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(max(10px, env(safe-area-inset-bottom)) + 56px); width: min(94vw, 440px); max-height: 52vh; overflow-y: auto; background: rgba(32,24,16,.96); border: 2px solid #c99a5b; border-radius: 16px; padding: 10px 12px 12px; box-sizing: border-box; display: none; font-size: 14px; }
  @media (min-width: 700px) { #card { left: auto; right: 10px; transform: none; top: 52px; bottom: 70px; max-height: none; width: 360px; } }
  #card .x { position: absolute; right: 8px; top: 8px; background: #5a4632; color: #ffe9c4; border: 0; border-radius: 10px; width: 32px; height: 32px; font-size: 15px; }
  #card .head { display: flex; gap: 10px; align-items: center; margin-bottom: 6px; padding-right: 36px; }
  #card .big { font-size: 30px; }
  #card h2 { margin: 0 0 3px; font-size: 18px; color: #ffe2a8; }
  #card h3 { margin: 10px 0 4px; font-size: 14px; color: #ffd27a; }
  .chip2 { display: inline-block; background: #4a3620; border: 1px solid #8a6a3e; border-radius: 10px; padding: 1px 8px; font-size: 12px; font-weight: 600; margin: 1px 2px 1px 0; }
  #card .row { display: flex; gap: 8px; align-items: flex-start; background: #2a1f14; border-radius: 12px; padding: 6px 8px; margin: 4px 0; border-left: 4px solid #8a6a3e; }
  #card .ico { font-size: 22px; width: 28px; text-align: center; }
  #card .grow { flex: 1; min-width: 0; }
  #card .line { display: flex; justify-content: space-between; font-weight: 600; }
  #card small { opacity: .85; font-size: 12px; display: block; margin-top: 2px; }
  .bar { height: 8px; background: #15110c; border-radius: 5px; overflow: hidden; margin-top: 3px; } .bar i { display: block; height: 100%; border-radius: 5px; }
  #card .warn { background: #5a2a1e; border: 1px solid #e0584a; border-radius: 12px; padding: 6px 9px; margin: 6px 0; font-weight: 600; }
  #card .gift, #card .note { background: #23301e; border: 1px solid #5cc46a; border-radius: 12px; padding: 6px 9px; margin: 6px 0; font-weight: 600; }
  #card .note.big2 { font-size: 15px; }
  #card .act { width: 100%; margin-top: 8px; background: #2f8f8a; color: #fff; border: 0; border-radius: 12px; padding: 10px; font-size: 15px; font-weight: 700; }
  #card .act:disabled { background: #555; color: #bbb; }
  #card .chips { display: flex; flex-wrap: wrap; gap: 4px; }
  #stage { position: fixed; top: calc(max(8px, env(safe-area-inset-top)) + 32px); left: 10px; font-size: 11px; opacity: .7; pointer-events: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"></div>
<div id="stage">Rebuild preview · stage 3 in progress: factories</div>
<div id="toast"></div>
<div id="hint"></div>
<button id="undo">↶ Undo</button>
<div id="confirm"><span id="ctext"></span><button id="turn">⟳ Turn</button><button id="ok">✓ Build</button><button id="cancel">✕</button></div>
<div id="buildMenu"></div>
<div id="card"></div>
<div id="bar">
  <button id="buildBtn">🏗 Build</button>
  <button data-mode="rail">🛤 Rails</button>
  <button data-mode="double">═ Double</button>
  <button data-mode="remove">✂ Remove</button>
  <button data-mode="train">🚂 Train</button>
  <button id="newGame">🗺 New</button>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
